plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.10.3'
group = 'com.example.ribbon'
archivesBaseName = 'ribbon'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=embeddium.mixins.json"
            arg "-mixin.config=sodium-extra.mixins.json"
            arg "-mixin.config=ribbon.mixins.json"
            mods { ribbon { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=embeddium.mixins.json"
            arg "-mixin.config=sodium-extra.mixins.json"
            arg "-mixin.config=ribbon.mixins.json"
            mods { ribbon { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jarJar.enable()

repositories {
    mavenCentral()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }

    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.23"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
}

mixin {
    add sourceSets.main, "embeddium.refmap.json"
    config "embeddium.mixins.json"
    config "sodium-extra.mixins.json"
    config "ribbon.mixins.json"
}

tasks.named('jar', Jar).configure {
    // ★ 关键修复：把 Mixin AP 生成在 tmp 里的 refmap 手动打进 jar
    from("${buildDir}/tmp/compileJava") {
        include "embeddium.refmap.json"
    }
    archiveClassifier.set('dev')
}

tasks.named('jarJar').configure {
    archiveClassifier.set('')
}

afterEvaluate {
    tasks.named('reobfJar').configure {
        dependsOn 'jar'
        dependsOn 'jarJar'
        input = tasks.named('jarJar').flatMap { it.archiveFile }
    }
}