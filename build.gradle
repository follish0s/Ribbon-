plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.9.2'
group = 'com.example.ribbon'
archivesBaseName = 'ribbon'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=embeddium.mixins.json"
            arg "-mixin.config=sodium-extra.mixins.json"
            arg "-mixin.config=ribbon.mixins.json" // <--- 新增
            mods { ribbon { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=embeddium.mixins.json"
            arg "-mixin.config=sodium-extra.mixins.json"
            arg "-mixin.config=ribbon.mixins.json" // <--- 新增
            mods { ribbon { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jarJar.enable()

repositories {
    mavenCentral()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.23"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // MixinExtras
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // ==========================================================
    // Hassium —— 已注释（排查游戏卡死/HUD NPE 用）
    // 等游戏稳定后再取消注释测试
    // ==========================================================
    // jarJar(files("libs/hassium-forge-2.0.3-1.20.1.jar"))
}

mixin {
    add sourceSets.main, "embeddium.refmap.json"
    config "embeddium.mixins.json"
    config "sodium-extra.mixins.json"
    config "ribbon.mixins.json" // <--- 新增
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ribbon",
                "Specification-Vendor"    : "example",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "example",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "embeddium.mixins.json,sodium-extra.mixins.json,ribbon.mixins.json" // <--- 新增
        ])
    }
}

tasks.named('jar').configure {
    archiveClassifier.set('dev')
}

tasks.named('jarJar').configure {
    archiveClassifier.set('')
}

afterEvaluate {
    tasks.named('reobfJar').configure {
        dependsOn 'jar'
        dependsOn 'jarJar'
        input = tasks.named('jarJar').flatMap { it.archiveFile }
    }
}